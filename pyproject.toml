[project]
name = "biwak"
version = "0.0.1"
license = "BSD-3-Clause"
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "channels>=4.3.2",
  "channels-redis>=4.3",
  "coverage[toml]>=7.17.3",
  "django>=6.1.3",
  "django-allauth[mfa,socialaccount]>=65.22.1",
  "django-anymail>=15.2",
  "django-canonical-domain>=0.11",
  "django-debug-toolbar>=8",
  "django-ninja>=1.8",
  "django-storages[s3]>=1.14.6",
  "django-tree-queries>=0.29",
  "email-reply-parser>=0.5.12",
  "granian>=2.8.8",
  "icalendar>=7.3.2",
  "markdown-it-py[linkify]>=4.3",
  "markdownify>=1.2.4",
  "mdit-py-plugins>=0.7",
  "nh3>=0.3.8",
  "pillow>=13",
  "psycopg[binary]>=3.3.9",
  "pycrdt>=0.14.13",
  "pypdfium2>=5.15.2",
  "python-dateutil>=2.9",
  "sentry-sdk<3",
  "speckenv>=7",
  "time-machine>=3.6",
]

[dependency-groups]
# The CLI tests run the CLI, the deployment doesn't need it (UV_NO_DEV)
dev = [
  "biwak-cli",
  "daphne>=4.2.3",
  "moto>=5.2.5",
  "playwright>=1.64.1",
  "tblib>=3.2.2",
  "uvicorn[standard]>=0.54",
]

[tool.uv]
sources.biwak-cli = { path = "cli", editable = true }

[tool.ruff]
target-version = "py315"
preview = true
fix = true
show-fixes = true
lint.extend-select = [
  "ASYNC",
  "B",
  "C4",
  "C90",
  "DJ",
  "E",
  "F",
  "FBT",
  "I",
  "INP",
  "INT",
  "ISC",
  "LOG",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLW",
  "RET",
  "RUF005",
  "RUF006",
  "RUF007",
  "RUF008",
  "RUF009",
  "RUF010",
  "RUF015",
  "RUF016",
  "RUF017",
  "RUF100",
  "RUF200",
  "SLOT",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.extend-ignore = [
  # Allow zip() without strict=
  "B905",
  # No line length errors
  "E501",
  # Deferred imports for circular import avoidance are a common Django pattern
  "PLC0415",
  # Mutable class attributes are fine
  "RUF012",
]
lint.per-file-ignores."*/migrat*/*" = [
  "N806",
  "N999",
]
lint.per-file-ignores."scripts/*" = [
  "INP",
]
lint.isort.combine-as-imports = true
lint.isort.lines-after-imports = 2
lint.mccabe.max-complexity = 15

[tool.coverage]
run.omit = [
  "*migrate*",
  "*migrations*",
  "*venv*",
]
run.branch = true
# Parallel test runs (./runtests.sh): a file per process, combined after
run.concurrency = [ "multiprocessing", "thread" ]
run.parallel = true
run.sigterm = true
report.skip_covered = true
report.show_missing = true

[tool.djangofmt]
indent-width = 2
profile = "django"
