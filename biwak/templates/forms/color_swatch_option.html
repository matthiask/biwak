{% load i18n %}
<label class="wb-color-choice" title="{{ widget.label }}">
  <input
    type="radio"
    name="{{ widget.name }}"
    value="{{ widget.value }}"
    {% if widget.attrs.id %}id="{{ widget.attrs.id }}"{% endif %}
    {% if widget.selected %}checked{% endif %}
    aria-label="{{ widget.label }}"
  >
  {% if widget.value %}
    <span class="wb-project-dot wb-color-swatch" data-project-color="{{ widget.value }}"></span>
  {% else %}
    <span class="wb-color-swatch wb-color-none"></span>
  {% endif %}
</label>
