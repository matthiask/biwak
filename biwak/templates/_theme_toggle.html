{% load biwak i18n %}
{% comment %}One icon per mode, frontend/theme.js shows the current one.{% endcomment %}
<button
  class="btn btn-sm btn-quiet me-2"
  type="button"
  data-theme-toggle
  data-title-auto="{% translate 'Theme: Auto' %}"
  data-title-light="{% translate 'Theme: Light' %}"
  data-title-dark="{% translate 'Theme: Dark' %}"
  aria-label="{% translate 'Cycle theme' %}"
  title="{% translate 'Theme: Auto' %}"
>
  <span data-theme-icon="auto">{% icon "circle-half" %}</span>
  <span data-theme-icon="light" hidden>{% icon "sun" %}</span>
  <span data-theme-icon="dark" hidden>{% icon "moon-stars" %}</span>
</button>
