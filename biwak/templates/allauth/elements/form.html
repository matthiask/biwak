{% load allauth %}
<form method="{{ attrs.method }}" {% if attrs.action %}action="{{ attrs.action }}"{% endif %} class="mb-3">
  {% slot body %}
  {% endslot %}
  {% if slots.actions %}
    <div class="d-flex flex-wrap gap-2 align-items-center mt-3">
      {% slot actions %}
      {% endslot %}
    </div>
  {% endif %}
</form>
