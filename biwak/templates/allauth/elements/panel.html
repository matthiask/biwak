{% load allauth %}
<section class="card mb-4">
  <div class="card-body">
    <h2 class="h5">
      {% slot title %}
      {% endslot %}
    </h2>
    {% slot body %}
    {% endslot %}
    {% if slots.actions %}
      <div class="d-flex flex-wrap gap-2 mt-3">
        {% for action in slots.actions %}{{ action }}{% endfor %}
      </div>
    {% endif %}
  </div>
</section>
