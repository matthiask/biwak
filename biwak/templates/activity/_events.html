{% load i18n %}
<ul class="list-unstyled wb-events">
  {% for event in events %}
    <li class="mb-2">
      {% include "activity/_event.html" %}
      <div class="small text-body-secondary">{{ event.created_at|timesince }}</div>
    </li>
  {% empty %}
    <li class="text-body-secondary">{% translate "Nothing yet." %}</li>
  {% endfor %}
</ul>
