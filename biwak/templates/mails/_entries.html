{% load biwak %}
{% for entry in entries %}
  <p style="margin: 12px 0 4px"><strong>{{ entry.line }}</strong></p>
  {% if entry.comment %}
    <div style="margin-left: 8px; padding-left: 8px; border-left: 3px solid #ddd">
      {{ entry.comment.content|mail_markdown:item_obj }}
    </div>
  {% endif %}
  {% if entry.reactions %}<p style="margin: 4px 0 12px 8px">{{ entry.reactions }}</p>{% endif %}
{% endfor %}
