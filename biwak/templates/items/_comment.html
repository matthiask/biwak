{% load biwak reactions %}
<div class="card mb-2" id="comment-{{ comment.pk }}" data-live>
  <div class="card-body">
    {# Wrapping like a sentence on phones: the date follows the name #}
    <div class="small text-body-secondary mb-1">
      {% avatar comment.author %}
      <strong>{{ comment.author.display_name }}</strong> · <span
        class="text-nowrap"
      >{{ comment.created_at|date:"j. M Y, H:i" }}</span>
    </div>
    <div class="wb-markdown">{% checklist_markdown comment.content item comment %}</div>
    {% reactions item comment %}
  </div>
</div>
