{% load biwak i18n %}
<div class="wb-todo" data-todo="{{ todo.pk }}" id="todo-{{ todo.pk }}" data-live data-kb-row>
  {% if not todo.todo.is_completed %}<span
      class="wb-handle"
      data-handle
      title="{% translate 'Drag to move; click several to move them together' %}"
    >{% icon "grip-vertical" %}</span>{% endif %}
  {% include "items/_todo_lead.html" %}
  {% include "items/_todo_assignees.html" %}
  {% due_badge todo.todo %}
  {% include "items/_signals.html" %}
  <div class="wb-peek w-100" id="peek-{{ todo.pk }}"></div>
</div>
