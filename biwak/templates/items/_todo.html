{% load biwak i18n %}
<div class="wb-todo" data-todo="{{ todo.pk }}">
  <span
    class="wb-handle"
    data-handle
    title="{% translate 'Drag to move; click several to move them together' %}"
  >{% icon "grip-vertical" %}</span>
  <form method="post" action="{% url 'todo_toggle' todo.pk %}" class="d-inline">
    {% csrf_token %}
    <button
      type="submit"
      class="wb-check{% if todo.todo.is_completed %} is-done{% endif %}"
      title="{% if todo.todo.is_completed %}{% translate 'Reopen' %}{% else %}{% translate 'Complete' %}{% endif %}"
    >
      {% if todo.todo.is_completed %}{% icon "check-lg" %}{% endif %}
    </button>
  </form>
  <a
    href="{{ todo.get_absolute_url }}"
    class="wb-todo-title{% if todo.todo.is_completed %} text-decoration-line-through text-body-secondary{% endif %}"
  >{{ todo|item_title }}</a>
  {% for person in todo.todo.assignees.all %}<span
      class="badge wb-person"
    >{{ person.get_short_name }}</span>{% endfor %}
  {% if todo.todo.due_on %}<span class="small text-body-secondary">{% icon "calendar-event" %}
      {{ todo.todo.due_on|date:"j. M" }}</span>{% endif %}
</div>
