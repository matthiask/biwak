{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Edit the project" %} – {{ project }} – Biwak{% endblock %}

{% block content %}
  <nav class="small mb-2"><a href="{{ project.get_absolute_url }}">{{ project }}</a></nav>
  <h1 class="mb-3">{% translate "Edit the project" %}</h1>
  <div class="card wb-form-card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary">{% translate "Save" %}</button>
        <a href="{{ project.get_absolute_url }}" class="btn btn-quiet">{% translate "Cancel" %}</a>
      </form>
    </div>
  </div>
{% endblock content %}
