{% load biwak i18n %}
<form
  method="post"
  action="{% url 'project_bookmark' project.pk %}"
  hx-post="{% url 'project_bookmark' project.pk %}"
  hx-swap="outerHTML"
  class="wb-card-bookmark"
>
  {% csrf_token %}
  <input type="hidden" name="card" value="1">
  <input type="hidden" name="next" value="{% url 'projects' %}">
  {% if is_bookmarked %}
    <button type="submit" class="btn btn-sm btn-quiet" title="{% translate 'Remove the bookmark' %}">
      {% icon "bookmark-fill" %}<span class="visually-hidden">{% translate "Remove the bookmark" %}</span>
    </button>
  {% else %}
    <button
      type="submit"
      name="bookmark"
      value="1"
      class="btn btn-sm btn-quiet"
      title="{% translate 'Bookmark' %}"
    >
      {% icon "bookmark" %}<span class="visually-hidden">{% translate "Bookmark" %}</span>
    </button>
  {% endif %}
</form>
