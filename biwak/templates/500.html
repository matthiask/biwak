{% load i18n %}

    <style>
      body {
        margin: 0;
        line-height: 1.5;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{% translate "Server error" %}</h1>
      <p>{% translate "Something went wrong. Please try again later." %}</p>
      <p><a href="/">{% translate "Back to Home" %}</a></p>
    </main>

</html>
