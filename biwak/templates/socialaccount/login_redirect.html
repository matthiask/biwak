<!DOCTYPE html>
{# allauth's, in sentence case like the rest #}
<html>
  {% load allauth i18n %}
  <head>
    <title>{% translate "Sign in" %} | {{ provider }}</title>
    <meta http-equiv="refresh" content="0;URL='{{ redirect_to }}'">
  </head>
  <body>
    {% element p %}
    <a href="{{ redirect_to }}">{% translate "Continue" %}</a>
    {% endelement %}
  </body>
</html>
