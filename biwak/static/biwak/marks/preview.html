<!DOCTYPE html>

<title>Biwak marks</title>
<style>
  body {
    margin: 0;
    font: 13px system-ui, sans-serif;
  }
  section {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    padding: 24px;
    gap: 20px 12px;
  }
  .light {
    background: #eeebe4;
    color: #1d1b19;
  }
  .dark {
    background: #1d1b19;
    color: #eeebe4;
  }
  h2 {
    grid-column: 1/-1;
    margin: 0;
    font-size: 14px;
  }
  figure {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    margin: 0;
    gap: 10px;
  }
  figcaption {
    flex-basis: 100%;
    font-size: 12px;
  }
  .m {
    display: inline-flex;
    width: var(--s);
    height: var(--s);
    overflow: hidden;
    border-radius: 50%;
    color: #fff;
  }
  .m svg {
    width: 100%;
    height: 100%;
  }
</style>
