[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
]

[project]
name = "biwak-cli"
version = "0.31.0"
description = "The command line interface of Biwak"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  { name = "Matthias Kestenholz" },
]
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click",
  "requests",
  "rich",
  "tomli-w",
]
scripts.biwak = "biwak_cli:cli"

[tool.setuptools]
packages = [
  "biwak_cli",
]
