name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch (or pull request) cancels the run still
# going: only the newest commit's result matters
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: 1

jobs:
  # The Django tests without the browser tests: fast, they fail early
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync
      # The catalog's tests run msgfmt and makemessages (specs/languages.md)
      - name: Install gettext
        run: command -v msgfmt || (sudo apt-get update && sudo apt-get install -y gettext)
      - name: Install Node and yarn (mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      # The stylesheet test reads the built CSS
      - name: Build the bundle
        run: |
          yarn install --frozen-lockfile
          yarn rspack build --mode production
      - name: Test with the Django testsuite
        env:
          ALLOWED_HOSTS: '["*"]'
          DATABASE_URL: "postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres"
          DEBUG: "True"
          LIVE: "False"
          SECRET_KEY: "unsafe"
          TESTING: "True"
        # A process per CPU, no coverage: nothing reads it (decided
        # 2026-11-21, COVERAGE=1 ./runtests.sh measures it locally)
        run: uv run ./manage.py test -v2 --parallel auto --exclude-tag e2e

  # The browser tests (Playwright), next to the Django tests
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync
      - name: Install the browser for the end-to-end tests
        run: uv run playwright install --with-deps chromium
      - name: Install Node and yarn (mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Build the bundle
        run: |
          yarn install --frozen-lockfile
          yarn rspack build --mode production
      - name: Test in the browser
        env:
          ALLOWED_HOSTS: '["*"]'
          DATABASE_URL: "postgres://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres"
          DEBUG: "True"
          LIVE: "False"
          SECRET_KEY: "unsafe"
          TESTING: "True"
        # Two processes, each with its server and Chromium, on the runner's
        # four CPUs
        run: uv run ./manage.py test -v2 --parallel 2 --tag e2e

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync
      - name: Run the pre-commit hooks
        env:
          DATABASE_URL: "postgres://localhost/unused"
          SECRET_KEY: "unsafe"
          # The settings require a Redis for the channel layer outside
          # development and tests; nothing connects to it while checking
          CACHE_URL: "hiredis://localhost:6379/0"
        run: uvx prek run --all-files --show-diff-on-failure
